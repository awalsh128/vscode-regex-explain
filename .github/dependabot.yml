# Pull requests target staging, since main only fast-forwards to it (see CONTRIBUTING.md#branches).
# Titles use the build type, which doesn't trigger a release; retitle a pull request as fix: when a
# runtime dependency update should ship. Grouping keeps one pull request, and a title within
# commitlint's 100-character limit, per ecosystem and update type. The cooldown skips releases
# younger than a week, giving a compromised release time to be caught and pulled.
version: 2

updates:
  # Workflows and the composite actions under .github/actions, whose SHA pins this keeps current.
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/.github/actions/*"
    target-branch: staging
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      actions:
        patterns: ["*"]

  # The root workspace, and the release tools locked apart from it in the semantic-release action.
  - package-ecosystem: npm
    directories:
      - "/"
      - "/.github/actions/semantic-release"
    target-branch: staging
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
