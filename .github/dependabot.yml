# Pull requests target staging, since main only fast-forwards to it (see CONTRIBUTING.md#branches).
# Titles use the build type, which doesn't trigger a release; retitle a pull request as fix: when a
# runtime dependency update should ship. Grouping keeps one pull request per ecosystem and update
# type. Group names are short because they appear in titles, which commitlint limits to 100
# characters; retitle a pull request that still goes over. The cooldown skips releases younger than
# a week, giving a compromised release time to be caught and pulled.
version: 2

updates:
  # Workflows and the composite actions under .github/actions, whose SHA pins this keeps current.
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/.github/actions/*"
    target-branch: staging
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      actions:
        patterns: ["*"]

  # The root workspace, and the release tools locked apart from it in the semantic-release action.
  - package-ecosystem: npm
    directories:
      - "/"
      - "/.github/actions/semantic-release"
    target-branch: staging
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      npm:
        update-types: [minor, patch]
    ignore:
      # Pinned to engines.vscode, the oldest VS Code the extension supports; raise them together.
      - dependency-name: "@types/vscode"
      # Majors follow engines.node, the oldest Node the packages support.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # typescript-eslint must support a TypeScript major before the project can move to it.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
