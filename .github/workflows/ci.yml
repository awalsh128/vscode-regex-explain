name: CI

on:
  # staging: gates library release candidates, and gives the promote workflow a result for
  # staging's exact commit. main: reports the status of each promotion (README badge).
  push:
    branches: [main, staging]
  pull_request:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
      pull-requests: write
      checks: write

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node 24

      - name: Setup
        uses: ./.github/actions/setup

      # Runtime dependencies ship to npm users and are bundled into the extension, so any advisory
      # fails the build.
      - name: Audit runtime dependencies
        uses: oke-py/npm-audit-action@f02a3cf15e7a1860efac849dd45126f9c2cafe4f
        with:
          production_flag: true
          audit_level: low
          github_token: ${{ secrets.GITHUB_TOKEN }}
          create_pr_comments: true
          create_issues: true
          issue_title: npm audit found vulnerabilities in runtime dependencies
          issue_labels: vulnerability,test
          dedupe_issues: true

      # Development tools never ship, so moderate advisories are reported in an issue without
      # failing the build.
      - name: Report development dependency advisories
        uses: oke-py/npm-audit-action@f02a3cf15e7a1860efac849dd45126f9c2cafe4f
        with:
          audit_level: moderate
          fail_on_vulnerabilities: false
          github_token: ${{ secrets.GITHUB_TOKEN }}
          create_pr_comments: true
          create_issues: true
          issue_labels: vulnerability,test
          dedupe_issues: true

      # Some tools run with publishing credentials, so high and critical advisories still fail.
      - name: Audit all dependencies for high severity
        uses: oke-py/npm-audit-action@f02a3cf15e7a1860efac849dd45126f9c2cafe4f
        with:
          audit_level: high
          github_token: ${{ secrets.GITHUB_TOKEN }}
          create_pr_comments: false
          create_issues: false

      - name: Validate agent configs
        id: agnix
        uses: agent-sh/agnix@fefbece836bd558bbbc0847633f995d8138e8f08 # v0.61.0
        with:
          target: "claude-code"
          format: "sarif"

      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ steps.agnix.outputs.sarif-file }}

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Check cross-file consistency
        run: npm run check

      - name: Compile
        run: npm run compile

      - name: Unit tests
        run: npm run test:unit

      - name: Script tests
        run: npm run test:scripts

      - name: Integration tests
        run: xvfb-run --auto-servernum npm run test:integration

      # Catches packaging regressions, such as vsce following workspace links, before a release.
      - name: Package the extension
        run: npm run package --prefix packages/vscode-regex-explain

      - name: Pack the library
        run: npm pack --dry-run -w packages/regex-explain

  # Library release candidates are only cut from staging commits that pass CI.
  release-candidate:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/staging' }}
    needs: test
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    uses: ./.github/workflows/publish-library.yml
