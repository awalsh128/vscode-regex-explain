name: CI

on:
  # staging: gates library release candidates, and gives the promote workflow a result for
  # staging's exact commit. main: reports the status of each promotion (README badge).
  push:
    branches: [main, staging]
  pull_request:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  # Audits read only the lockfiles, so this job installs nothing: the write permissions it needs for
  # issues, comments and code scanning never reach dependency code.
  audit:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
      pull-requests: write
      security-events: write
    env:
      # Pull requests from forks get a read-only token, so they can't comment, file issues, or upload
      # code scanning results.
      CAN_WRITE:
        ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name ==
        github.repository }}
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # Runtime dependencies ship to npm users and are bundled into the extension, so any advisory
      # fails the build.
      - name: Audit runtime dependencies
        uses: oke-py/npm-audit-action@f02a3cf15e7a1860efac849dd45126f9c2cafe4f # v4.0.1
        with:
          production_flag: true
          audit_level: low
          github_token: ${{ secrets.GITHUB_TOKEN }}
          create_pr_comments: ${{ env.CAN_WRITE }}
          create_issues: ${{ env.CAN_WRITE }}
          issue_title: npm audit found vulnerabilities in runtime dependencies
          issue_labels: vulnerability,test
          dedupe_issues: true

      # Development tools never ship, so moderate advisories are reported in an issue without
      # failing the build.
      - name: Report development dependency advisories
        uses: oke-py/npm-audit-action@f02a3cf15e7a1860efac849dd45126f9c2cafe4f # v4.0.1
        with:
          audit_level: moderate
          fail_on_vulnerabilities: false
          github_token: ${{ secrets.GITHUB_TOKEN }}
          create_pr_comments: ${{ env.CAN_WRITE }}
          create_issues: ${{ env.CAN_WRITE }}
          issue_labels: vulnerability,test
          dedupe_issues: true

      # Some tools run with publishing credentials, so high and critical advisories still fail.
      - name: Audit all dependencies for high severity
        uses: oke-py/npm-audit-action@f02a3cf15e7a1860efac849dd45126f9c2cafe4f # v4.0.1
        with:
          audit_level: high
          github_token: ${{ secrets.GITHUB_TOKEN }}
          create_pr_comments: false
          create_issues: false

      - name: Validate agent configs
        id: agnix
        uses: agent-sh/agnix@fefbece836bd558bbbc0847633f995d8138e8f08 # v0.61.0
        with:
          target: "claude-code"
          format: "sarif"

      # Uploads even when agnix fails, since that is when the findings matter.
      - name: Upload agent config results
        if: ${{ always() && env.CAN_WRITE == 'true' && steps.agnix.outputs.sarif-file != '' }}
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: ${{ steps.agnix.outputs.sarif-file }}

  # Runs dependency install scripts and the code under test, so it gets a read-only token that
  # isn't left in .git/config.
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Check cross-file consistency
        run: npm run check

      - name: Compile
        run: npm run compile

      - name: Unit tests
        run: npm run test:unit

      - name: Script tests
        run: npm run test:scripts

      - name: Integration tests
        run: xvfb-run --auto-servernum npm run test:integration

      # Catches packaging regressions, such as vsce following workspace links, before a release.
      - name: Package the extension
        run: npm run package --prefix packages/vscode-regex-explain

      - name: Pack the library
        run: npm pack --dry-run -w packages/regex-explain

  # Library release candidates are only cut from staging commits that pass CI.
  release-candidate:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/staging' }}
    needs: [audit, test]
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    uses: ./.github/workflows/publish-library.yml
