name: Sync Labels

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/labels.yaml"

permissions: {}

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # This job can edit labels, so dependencies' install scripts don't run.
      - name: Setup
        uses: ./.github/actions/setup
        with:
          ignore-scripts: true

      - name: Sync labels
        run: npm run sync-labels
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
