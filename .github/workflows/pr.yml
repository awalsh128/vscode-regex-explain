name: Pull Request

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  check-branch:
    name: Check branch
    runs-on: ubuntu-24.04
    steps:
      # main is only updated by promote.yml, which fast-forwards it to staging; a merge into main
      # would add a commit that staging doesn't have.
      - name: Require staging as the base branch
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$BASE_REF" != "staging" ]; then
            echo "::error::Pull requests target staging, not $BASE_REF; main is updated by promotion."
            exit 1
          fi

  commitlint:
    name: Lint commit messages
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node 24
        with:
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup

      # The commit-msg hook can be skipped locally, and semantic-release versions both packages from
      # these messages, so check every PR commit too.
      - name: Lint commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npx commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node 24

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
