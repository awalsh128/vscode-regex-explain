name: Publish Library

# Publishes regex-explain to npm at the version of an extension release. The library and the
# extension share one version: publish-extension.yml tags `vX.Y.Z` and then starts this workflow
# with that tag, so the npm package, the VSIX and the GitHub release all carry the same number.
# Releases (even minor versions) are published under npm's default `latest` dist-tag. The
# extension's pre-releases (odd minors, which the Marketplace requires) are published under `next`,
# so `npm install regex-explain` never picks one up but `regex-explain@next` can try it. A run for
# a version that npm already has publishes nothing, so a failed run can be started again.
#
# No secrets: the job's OIDC token is exchanged for the npm credential. npm trusted publishing is
# bound to this workflow file and the 'release' environment, which only main can use here, so the
# workflow must be started on its own (`gh workflow run`), never called from another workflow.
#
# See CONTRIBUTING.md#publishing-the-library.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, such as v1.4.0 (a release) or v1.5.0 (a pre-release)"
        type: string
        required: true
      dry-run:
        description: "Build and pack the library without publishing it or deploying the docs"
        type: boolean
        required: false
        default: false

permissions: {}

jobs:
  publish:
    # The release environment only lets main and staging in; releases are cut from main.
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    outputs:
      version: ${{ steps.version.outputs.version }} # Empty on dry runs and pre-releases
    # One publish at a time; never cancel one that is publishing.
    concurrency:
      group: publish-library
      cancel-in-progress: false
    permissions:
      actions: read # For checking CI results
      contents: read
      id-token: write # For OIDC: npm trusted publishing with provenance
      pages: read # For configure-pages to read the Pages site settings
    steps:
      # Resolves the tag to a commit before anything runs, and refuses anything that is not a
      # release or pre-release tag.
      - name: Checkout the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false

      - name: Check the tag
        id: version
        env:
          TAG: ${{ inputs.tag }}
          DRY_RUN: ${{ inputs.dry-run }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::'$TAG' is not a release tag such as v1.4.0."
            exit 1
          fi
          # VS Code's convention: odd minor versions are pre-releases.
          if (( BASH_REMATCH[2] % 2 == 1 )); then
            echo "dist-tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "dist-tag=latest" >> "$GITHUB_OUTPUT"
            # Only releases update the docs site.
            if [[ "$DRY_RUN" != "true" ]]; then
              echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
            fi
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Require CI success
        uses: ./.github/actions/require-ci-success
        with:
          sha: ${{ steps.version.outputs.sha }}
          token: ${{ github.token }}

      # This job can mint an npm publish token, so dependencies' install scripts don't run, and it
      # doesn't use the npm cache that other runs write.
      # dist/ is built by the library's prepack script when npm publishes.
      - name: Setup
        uses: ./.github/actions/setup
        with:
          ignore-scripts: true
          cache: false

      # The committed package.json keeps the placeholder version 0.0.0; the tag is the version.
      - name: Set the version
        env:
          TAG: ${{ inputs.tag }}
        run: npm pkg set version="${TAG#v}" --prefix packages/regex-explain

      # Builds the API docs for the Pages deployment below, and fails before publishing if they
      # don't build.
      - name: Build the API docs
        run: npm run docs:api -w regex-explain

      - name: Publish to npm
        env:
          TAG: ${{ inputs.tag }}
          DRY_RUN: ${{ inputs.dry-run }}
          DIST_TAG: ${{ steps.version.outputs.dist-tag }}
        shell: bash
        run: |
          set -euo pipefail
          version="${TAG#v}"
          if [[ "$DRY_RUN" == "true" ]]; then
            npm publish -w regex-explain --tag "$DIST_TAG" --dry-run
          elif npm view "regex-explain@$version" version > /dev/null 2>&1; then
            echo "regex-explain@$version is already on npm; nothing to publish."
          else
            npm publish -w regex-explain --tag "$DIST_TAG"
          fi

      - name: Setup Pages
        if: ${{ steps.version.outputs.version != '' }}
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        if: ${{ steps.version.outputs.version != '' }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: packages/regex-explain/docs/api

  # Deploys in its own job so it can use the github-pages environment, which records each deployment
  # and only allows main.
  deploy-pages:
    needs: publish
    if: ${{ needs.publish.outputs.version != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write # For GitHub Pages deployment
      id-token: write # For OIDC verification of the Pages deployment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
