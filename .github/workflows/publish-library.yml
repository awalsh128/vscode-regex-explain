name: Publish Library

# Releases regex-explain with semantic-release, always gated by CI:
# - staging: ci.yml calls this after CI passes, releasing a candidate (e.g. 1.2.0-rc.1) as a tag and
#   GitHub prerelease only.
# - main: promote.yml starts this after fast-forwarding main to a CI-passed staging commit,
#   releasing an official version (e.g. 1.2.0) and publishing it to npm.
# - Manual runs first require a successful CI run for the commit.
#
# No secrets: the job's OIDC token is exchanged for each credential.
# - Tags are pushed with an Octo STS token (.github/chainguard/release.sts.yaml).
# - npm trusted publishing is bound to this workflow file and the 'release' environment, which only
#   main and staging can use.
#
# See packages/regex-explain/release.config.cjs and CONTRIBUTING.md#publishing-the-library.
on:
  workflow_call:
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Run the release process without publishing anything or pushing tags"
        type: boolean
        required: false
        default: false

permissions: {}

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    # One release per branch at a time; never cancel one that is tagging.
    concurrency:
      group: release-library-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      actions: read # For checking CI results on manual runs
      contents: write # For GitHub releases
      id-token: write # For OIDC: the Octo STS tag token and npm trusted publishing with provenance
      issues: write # For semantic-release comments
      pull-requests: write # For semantic-release comments
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node 24
        with:
          fetch-depth: 0 # semantic-release reads every commit and tag since the last release
          persist-credentials: false

      - name: Require CI success
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: ./.github/actions/require-ci-success
        with:
          sha: ${{ github.sha }}
          token: ${{ github.token }}

      # This job can mint npm publish and GitHub tokens, so dependencies' install scripts don't run.
      # dist/ is built by the library's prepack script when npm publishes.
      - name: Setup
        uses: ./.github/actions/setup
        with:
          ignore-scripts: true

      # semantic-release-monorepo keeps only the commits that change packages/regex-explain.
      - name: Release
        uses: ./.github/actions/semantic-release
        with:
          working-directory: packages/regex-explain
          args: --extends semantic-release-monorepo
          dry-run: ${{ inputs.dry-run || false }}
