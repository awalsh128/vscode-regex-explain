name: "Setup environment"
description: "Sets up Node.js and installs dependencies"

inputs:
  ignore-scripts:
    description: >-
      Skip install scripts, both dependencies' and the root prepare script (husky). For privileged
      jobs, so dependency code can't run with their credentials at install.
    required: false
    default: "false"
  cache:
    description: >-
      Restore and save the npm download cache. Publishing jobs turn it off, so they never install
      from a cache that another workflow run wrote.
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: "24"
        cache: ${{ inputs.cache == 'true' && 'npm' || '' }}
        registry-url: "https://registry.npmjs.org"

    - name: Install dependencies
      shell: bash
      env:
        IGNORE_SCRIPTS: ${{ inputs.ignore-scripts }}
      run: |
        set -euo pipefail
        if [[ "$IGNORE_SCRIPTS" == "true" ]]; then
          npm ci --ignore-scripts
        else
          npm ci
        fi
